<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trova-cam live</title>
<style>
  :root {
    --bg: #0e0f11; --panel: #17191c; --line: #2a2d32;
    --text: #e8e9eb; --muted: #8b9098; --live: #3ddc84; --warn: #f5b942; --err: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .state { display: flex; align-items: center; gap: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.streaming { background: var(--live); box-shadow: 0 0 0 3px #3ddc8433; }
  .dot.starting, .dot.idle { background: var(--warn); }
  .dot.error, .dot.offline, .dot.paused { background: var(--err); }
  .spacer { flex: 1; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button, select, a.btn { font: inherit; color: var(--text); background: #22252a; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover, select:hover { border-color: #444a52; }
  #warn { padding: 6px 16px; background: #33290f; color: #ffd98a; border-bottom: 1px solid #5a4718; font-size: 13px; }
  #warn[hidden] { display: none; }
  main { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center;
    container-type: size; overflow: hidden; }
  #view { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* portrait (mobile) view: a tall 3:4 window on the middle of the picture */
  main.portrait #view { width: min(100%, 75cqh); object-fit: cover; }
  #msg { position: absolute; inset: auto 0 16px 0; margin: auto; width: fit-content; max-width: calc(100% - 32px);
    padding: 8px 12px; border-radius: 6px; background: #000c; color: var(--text); display: none; }
  #msg.show { display: block; }
  main:fullscreen { background: #000; }
  @media (max-width: 560px) { .controls { width: 100%; } .controls > * { flex: 1; text-align: center; } }
</style>
</head>
<body>
<header>
  <h1>trova-cam</h1>
  <div class="state"><span class="dot" id="dot"></span><span id="state">connecting…</span></div>
  <div class="spacer"></div>
  <div class="controls">
    <select id="layout" title="Portrait shows a tall crop of the middle, for phones">
      <option value="landscape">Landscape</option>
      <option value="portrait">Portrait</option>
    </select>
    <select id="fps" title="Lower this if the picture lags on weak WiFi">
      <option value="0">Max fps</option>
      <option value="5">5 fps</option>
      <option value="2">2 fps</option>
    </select>
    <a class="btn" href="/snapshot.jpg?download=1" title="Save a still image">Snapshot</a>
    <button id="full" title="Fullscreen">Fullscreen</button>
  </div>
</header>
<div id="warn" hidden></div>
<main id="stage">
  <img id="view" alt="Live camera view">
  <div id="msg"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const view = $("view"), stage = $("stage"), fpsSel = $("fps"), layoutSel = $("layout");
  let online = true, retry = null;

  function load(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch (e) { return fallback; } }
  function save(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  try { localStorage.removeItem("trova-rot"); localStorage.removeItem("trova-view-rot"); } catch (e) {}  // old Rotate button

  fpsSel.value = load("trova-fps", "0");
  layoutSel.value = load("trova-layout", "landscape");
  if (!fpsSel.value) fpsSel.value = "0";
  if (!layoutSel.value) layoutSel.value = "landscape";

  function applyLayout() { stage.classList.toggle("portrait", layoutSel.value === "portrait"); }
  layoutSel.onchange = () => { save("trova-layout", layoutSel.value); applyLayout(); };

  function connect() {
    clearTimeout(retry);
    const cap = fpsSel.value !== "0" ? "&fps=" + fpsSel.value : "";
    view.src = "/stream.mjpg?t=" + Date.now() + cap;
  }
  view.onerror = () => { clearTimeout(retry); retry = setTimeout(connect, 2000); };
  fpsSel.onchange = () => { save("trova-fps", fpsSel.value); connect(); };

  $("full").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (stage.requestFullscreen) stage.requestFullscreen();
  };

  function show(text) { $("msg").textContent = text || ""; $("msg").classList.toggle("show", !!text); }

  async function poll() {
    try {
      const s = await (await fetch("/status.json", { cache: "no-store" })).json();
      if (!online) { online = true; connect(); }
      $("dot").className = "dot " + s.camera;
      const parts = [s.camera];
      if (s.camera === "streaming") parts.push(s.fps + " fps");
      parts.push(s.width + "×" + s.height, Math.round(s.temp) + " °C",
                 s.viewers + (s.viewers === 1 ? " viewer" : " viewers"));
      $("state").textContent = parts.join(" · ");
      $("warn").hidden = !s.warnings.length;
      $("warn").textContent = "⚠ " + s.warnings.join("  ·  ");
      show(s.message);
    } catch (e) {
      online = false;
      $("dot").className = "dot offline";
      $("state").textContent = "offline";
      show("Can't reach trova-cam. Retrying…");
    }
  }

  applyLayout();
  connect();
  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
